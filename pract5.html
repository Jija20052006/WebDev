<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adding Images in Webpage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .student-info {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #444;
        }

        .section {
            background-color: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            border: 2px solid #555;
        }

        img {
            border: 2px solid black;
            border-radius: 8px;
            margin-top: 10px;
            max-width: 100%;
        }

        .responsive-img {
            width: 100%;
            height: auto;
        }

        .hover-img {
            width: 250px;
            transition: transform 0.5s;
        }

        .hover-img:hover {
            transform: scale(1.1);
        }

        figcaption {
            margin-top: 8px;
            font-style: italic;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="student-info">
        <h3>Name: Jija Kumbhojkar</h3>
        <h3>Roll No: Your 28</h3>
        <h3>Branch: CSE</h3>
    </div>

    <h1>Demonstration of Adding Images in Webpage</h1>

    <!-- 1. Simple Image -->
    <div class="section">
        <h2>1. Simple Image using &lt;img&gt; Tag</h2>

        <img src="https://picsum.photos/400/250"
             alt="Simple Image Example">
    </div>

    <!-- 2. Image with Caption -->
    <div class="section">
        <h2>2. Image with Caption</h2>

        <figure>
            <img src="https://picsum.photos/450/250"
                 alt="Nature Image">

            <figcaption>
                Beautiful scenery image with caption.
            </figcaption>
        </figure>
    </div>

    <!-- 3. Responsive Image -->
    <div class="section">
        <h2>3. Responsive Image</h2>

        <img src="https://picsum.photos/800/300"
             alt="Responsive Image"
             class="responsive-img">
    </div>

    <!-- 4. Clickable Image -->
    <div class="section">
        <h2>4. Clickable Image</h2>

        <a href="https://www.google.com"
           target="_blank">

            <img src="https://picsum.photos/300/200"
                 alt="Clickable Image">
        </a>

        <p>Click the image to open Google.</p>
    </div>

    <!-- 5. Animated Hover Image -->
    <div class="section">
        <h2>5. Hover Animation on Image</h2>

        <img src="https://picsum.photos/250/200"
             alt="Animated Hover Image"
             class="hover-img">
    </div>

    <!-- 6. GIF Image -->
    <div class="section">
        <h2>6. GIF Image</h2>

        <img src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif"
             alt="GIF Image"
             width="250">
    </div>

</body>

</html>
